# Same host rule as step 03 + a "tls" section = HTTPS.
# The certificate + private key live in a Secret called "shop-tls"
# (created with kubectl - see README step 1).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-tls
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.local                # HTTPS for this domain ...
      secretName: shop-tls          # ... using the certificate stored in this Secret
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80        # app itself still speaks plain HTTP. nginx handles HTTPS.
