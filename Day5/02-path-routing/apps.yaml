# TWO different apps, each with its own ClusterIP Service.
#   frontend -> the website
#   orders   -> the backend orders API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: traefik/whoami:v1.10.1
          env:
            - name: WHOAMI_NAME
              value: "frontend"       # every reply says "Name: frontend"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: traefik/whoami:v1.10.1
          env:
            - name: WHOAMI_NAME
              value: "orders"         # every reply says "Name: orders"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 80
