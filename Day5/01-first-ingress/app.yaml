# A normal app + a normal ClusterIP Service (exactly like Day 4 step 2).
# Nothing new here. Ingress (next file) will sit IN FRONT of this Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: traefik/whoami:v1.10.1
          env:
            - name: WHOAMI_NAME
              value: "web"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
