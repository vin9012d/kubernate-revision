apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-deploy
  labels:
    app: whoami-deploy
spec:
  replicas: 3
  revisionHistoryLimit: 5         # how many old ReplicaSets to keep for rollback
  selector:
    matchLabels:
      app: whoami-deploy          # MUST match template labels
  strategy:
    type: RollingUpdate           # default. Other option: Recreate (kill all, then start new)
    rollingUpdate:
      maxSurge: 1                 # max extra pods above "replicas" during update (3 -> up to 4)
      maxUnavailable: 0           # never go below 3 ready pods during update = zero downtime
  template:
    metadata:
      labels:
        app: whoami-deploy
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1   # change to v1.10.2 to practise rolling update
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
