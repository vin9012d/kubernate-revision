# NodePort Service for the SAME "web" pods from step 01.
# Opens port 30080 on EVERY node -> reachable from outside via <NodeIP>:30080
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80           # inside cluster:  web-nodeport:80
      targetPort: 80     # pod port
      nodePort: 30080    # outside:         <NodeIP>:30080   (allowed: 30000-32767)
