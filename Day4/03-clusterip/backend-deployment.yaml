# A "backend" app with 3 pods. The app listens on port 80 inside the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: traefik/whoami:v1.10.1
          ports:
            - containerPort: 80
