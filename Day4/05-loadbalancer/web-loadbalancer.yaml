# LoadBalancer Service for the SAME "web" pods from step 01.
# On a cloud (AWS EKS) -> AWS creates a real load balancer with a public address.
# On kind (our laptop)  -> EXTERNAL-IP stays <pending> (no cloud to ask).
apiVersion: v1
kind: Service
metadata:
  name: web-lb
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80           # port on the cloud load balancer
      targetPort: 80     # pod port
